<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Task List OS</title>
  <!--
    Double-click this to open your task list.
    If the task list helper is running on this computer (Claude starts it), this goes straight to
    http://localhost:4747. If it isn't, it opens the app, which explains how to start it.
  -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5F3EE; color: #191919; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    a { color: #9C5238; }
  </style>
</head>
<body>
  <p>Opening your task list. If nothing happens, <a href="http://localhost:4747/">open it here</a>.</p>
  <script>
    // Ask the helper if it's running; it answers by loading a tiny script
    var timer = setTimeout(notRunning, 1500);
    function running() { clearTimeout(timer); window.location.replace("http://localhost:4747/"); }
    function notRunning() { window.location.replace("apps/task-list/index.html"); }
    var probe = document.createElement("script");
    probe.src = "http://localhost:4747/api/alive.js?t=" + Date.now();
    probe.onload = function () { if (window.tlosAlive) running(); else notRunning(); };
    probe.onerror = notRunning;
    document.head.appendChild(probe);
  </script>
</body>
</html>
